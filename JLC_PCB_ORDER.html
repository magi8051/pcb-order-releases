<script>
const D=JSON.parse(document.getElementById('data').textContent);
const OWN='jlc_owner';try{const q=(location.search+location.hash).toLowerCase();if(/owner/.test(q))localStorage.setItem(OWN,'1');if(/guest/.test(q))localStorage.removeItem(OWN)}catch(e){}
const IS_OWNER=(()=>{try{return localStorage.getItem(OWN)==='1'}catch(e){return false}})();if(IS_OWNER)document.body.classList.add('owner');
document.getElementById('chk').textContent=D.checked;
const LS='jlc_memos_v1';
let memos=Object.assign({},D.memos);
try{const l=JSON.parse(localStorage.getItem(LS)||'{}');for(const k in l){if(!memos[k]||(l[k].updated||'')>(memos[k].updated||''))memos[k]=l[k]}}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const order=["결제대기","생산중","생산지연 의심","배송중","배송완료","취소"];let filt=null;
function bar(){const b=document.getElementById('bar');b.querySelectorAll('.chip').forEach(e=>e.remove());const sync=b.querySelector('.sync');
 const mk=(lab,n,key)=>{const c=document.createElement('span');c.className='chip'+(filt===key?' on':'');c.innerHTML=esc(lab)+'<b>'+n+'</b>';c.onclick=()=>{filt=key;render()};b.insertBefore(c,sync)};
 mk('전체',D.orders.length,null);order.forEach(s=>{const n=D.orders.filter(o=>o.status===s).length;if(n)mk(s,n,s)})}
let view='list';try{if(localStorage.getItem('jlc_view')==='week')view='week'}catch(e){}
function wkOf(ds){const d=new Date(ds.slice(0,10)+'T00:00:00Z');const wd=(d.getUTCDay()+6)%7;const mon=new Date(d-wd*864e5),sun=new Date(+mon+6*864e5);
 const t=new Date(+mon+3*864e5),y=t.getUTCFullYear(),w=1+Math.round(((t-Date.UTC(y,0,4))/864e5-3+((new Date(Date.UTC(y,0,4)).getUTCDay()+6)%7))/7);
 const f=x=>String(x.getUTCMonth()+1).padStart(2,'0')+'/'+String(x.getUTCDate()).padStart(2,'0');
 return {key:y+'-W'+String(w).padStart(2,'0'),label:`${mon.getUTCMonth()+1}월 ${Math.ceil(mon.getUTCDate()/7)}주차`,range:f(mon)+'(월) ~ '+f(sun)+'(일)'}}
function viewSw(){const b=document.getElementById('bar');let v=b.querySelector('.view');if(!v){v=document.createElement('span');v.className='view';v.innerHTML='<button data-v="list">목록</button><button data-v="week">주별</button>';b.prepend(v);
 v.querySelectorAll('button').forEach(x=>x.onclick=()=>{view=x.dataset.v;try{localStorage.setItem('jlc_view',view)}catch(e){}render()})}
 v.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.v===view))}
function renderWeek(){const W=document.getElementById('weekly');W.innerHTML='';const g={};
 D.orders.filter(o=>!filt||o.status===filt).forEach(o=>{const k=wkOf(o.date);(g[k.key]=g[k.key]||{k,list:[]}).list.push(o)});
 Object.keys(g).sort().reverse().forEach(key=>{const {k,list}=g[key];const amt=list.filter(o=>o.status!=='취소').reduce((a,o)=>a+Number(o.total||0),0);
  const cnt={};list.forEach(o=>cnt[o.status]=(cnt[o.status]||0)+1);
  const chips=order.filter(s=>cnt[s]).map(s=>`<span class="badge s-${esc(s.split(' ')[0])}">${esc(s)} ${cnt[s]}</span>`).join(' ');
  const rows=list.map(o=>{const trk=o.tracking?`<a href="https://www.ups.com/track?loc=ko_KR&tracknum=${esc(o.tracking)}" target="_blank">${esc(o.tracking)}</a>`:'-';
   const img=D.thumbs[o.batch]?`<img src="${D.thumbs[o.batch]}" alt="">`:'-';
   return `<tr><td>${esc(o.date)}</td><td class="no">${esc(o.batch)}</td><td class="img">${img}</td><td class="items">${esc(o.items)}</td><td>${esc(o.qty)}</td><td>$${Number(o.total).toFixed(2)}</td><td><span class="badge s-${esc(o.status.split(' ')[0])}">${esc(o.status)}</span></td><td>${esc(o.shipped)||'-'}</td><td class="no">${trk}</td><td><b>${esc(o.eta)}</b></td></tr>`}).join('');
  const sec=document.createElement('div');sec.className='wk';
  sec.innerHTML=`<div class="wkh"><h3>${k.label}</h3><span class="sum">${k.range} · ${k.key} · ${list.length}건 · $${amt.toFixed(2)}</span>${chips}</div>
  <table><thead><tr><th>주문일시</th><th>주문번호</th><th>PCB</th><th>품목</th><th>수량</th><th>금액</th><th>상태</th><th>출고일</th><th>트래킹</th><th>도착 예정</th></tr></thead><tbody>${rows}</tbody></table>`;W.appendChild(sec)});
 W.querySelectorAll('.img img').forEach(i=>i.onclick=()=>{zi.src=i.src;zoom.style.display='flex'})}
function render(){bar();viewSw();document.getElementById('weekly').style.display=view==='week'?'':'none';document.getElementById('listw').style.display=view==='week'?'none':'';
 if(view==='week'){renderWeek();return}
 const tb=document.getElementById('tb');tb.innerHTML='';
 D.orders.filter(o=>!filt||o.status===filt).forEach(o=>{const m=memos[o.batch]||{};const tr=document.createElement('tr');
  const trk=o.tracking?`<a href="https://www.ups.com/track?loc=ko_KR&tracknum=${esc(o.tracking)}" target="_blank">${esc(o.tracking)}</a>`:'-';
  const img=D.thumbs[o.batch]?`<img src="${D.thumbs[o.batch]}" alt="${esc(o.batch)}">`:'<span class="small">-</span>';
  tr.innerHTML=`<td>${esc(o.date)}</td><td class="no">${esc(o.batch)}<div class="small">${esc(o.type)}</div></td>
  <td class="own"><textarea class="memo" data-b="${esc(o.batch)}" placeholder="메모 입력">${esc(m.text||'')}</textarea><div class="mt">${m.updated?'수정 '+esc(m.updated.replace('T',' ').slice(0,16)):''}</div></td>
  <td class="img">${img}</td><td class="items">${esc(o.items)}</td><td>${esc(o.qty)}</td><td>$${Number(o.total).toFixed(2)}</td>
  <td><span class="badge s-${esc(o.status.split(' ')[0])}">${esc(o.status)}</span></td><td>${esc(o.prod)}</td><td>${esc(o.shipped)}</td>
  <td class="no">${trk}</td><td>${esc(o.location)}</td><td><b>${esc(o.eta)}</b></td><td class="small">${esc(o.note)}</td>`;tb.appendChild(tr)});
 tb.querySelectorAll('.memo').forEach(t=>{let tm;t.oninput=()=>{clearTimeout(tm);tm=setTimeout(()=>save(t),600)}});
 tb.querySelectorAll('.img img').forEach(i=>i.onclick=()=>{zi.src=i.src;zoom.style.display='flex'});}
zoom.onclick=()=>zoom.style.display='none';
// --- folder sync (File System Access API) ---
const st=document.getElementById('st');function S(t,c){st.textContent=t;st.className=c||''}
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('jlc_memo_db',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbGet(){try{const db=await idb();return await new Promise(r=>{const q=db.transaction('h').objectStore('h').get('dir');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}
async function idbSet(v){try{const db=await idb();db.transaction('h','readwrite').objectStore('h').put(v,'dir')}catch(e){}}
let dir=null;
async function readFolder(){if(!dir)return;try{const f=await (await dir.getFileHandle('memos.json',{create:true})).getFile();const t=await f.text();if(t.trim()){const fm=JSON.parse(t);
 for(const k in fm){if(!memos[k]||(fm[k].updated||'')>(memos[k].updated||''))memos[k]=fm[k]}}}catch(e){}}
async function writeFolder(){if(!dir)return false;try{const w=await (await dir.getFileHandle('memos.json',{create:true})).createWritable();await w.write(JSON.stringify(memos,null,1));await w.close();return true}catch(e){S('폴더 저장 실패 – 다시 연결해 주세요','warn');return false}}
function now(){const d=new Date(Date.now()+9*3600e3);return d.toISOString().slice(0,19)}
async function save(t){const b=t.dataset.b;memos[b]={text:t.value,updated:now()};localStorage.setItem(LS,JSON.stringify(memos));
 t.nextElementSibling.textContent='수정 '+memos[b].updated.replace('T',' ').slice(0,16);
 if(await writeFolder())S('memos.json 저장됨 '+memos[b].updated.slice(11,16),'ok');else if(!dir)S('브라우저에만 저장됨 – 폴더를 연결하면 엑셀에 반영돼요','warn')}
document.getElementById('conn').onclick=async()=>{
 if(!window.showDirectoryPicker){S('이 브라우저는 폴더 연결을 지원하지 않아요 (Chrome/Edge 사용)','warn');return}
 try{let h=await idbGet();if(h&&(await h.requestPermission({mode:'readwrite'}))==='granted'){dir=h}else{h=await window.showDirectoryPicker({id:'jlcmemo',mode:'readwrite'});dir=h;await idbSet(h)}
  await readFolder();render();await writeFolder();S('폴더 연결됨: '+dir.name+' (memos.json)','ok');document.getElementById('conn').textContent='폴더 연결됨'}catch(e){S('연결 취소됨','warn')}};
document.getElementById('dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(memos,null,1)],{type:'application/json'}));a.download='memos.json';a.click()};
(async()=>{render();if(!IS_OWNER)return;const h=await idbGet();if(h){try{if((await h.queryPermission({mode:'readwrite'}))==='granted'){dir=h;await readFolder();render();S('폴더 연결됨: '+h.name,'ok');document.getElementById('conn').textContent='폴더 연결됨';return}}catch(e){}
 S('메모 폴더 다시 연결 필요 (버튼 1회 클릭)','warn')}else S('처음 한 번 "메모 폴더 연결"을 눌러 D:\\Claude\\jlcpcb 폴더를 선택하세요','warn')})();
</script></body></html>
